<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>待办</title>
<style>
/* ============ 设计变量（浅/深两套，跟随系统） ============ */
:root{
  --bg:#f6f6f4; --card:#ffffff; --ink:#1a1a1a; --ink2:#6b6b6b; --ink3:#9a9a9a;
  --line:#e7e7e3; --accent:#2f6df6; --accent-soft:#e8f0fe;
  --amber:#b45309; --amber-bg:#fef3c7; --amber-deep:#92400e; --amber-deep-bg:#fde68a;
  --done:#a3a3a3; --danger:#b91c1c; --chip:#efefec; --shadow:0 1px 3px rgba(0,0,0,.07);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141414; --card:#1e1e1e; --ink:#eaeaea; --ink2:#9c9c9c; --ink3:#6f6f6f;
    --line:#2c2c2c; --accent:#6f9dff; --accent-soft:#1c2a45;
    --amber:#fbbf24; --amber-bg:#3a2c10; --amber-deep:#fcd34d; --amber-deep-bg:#4a3608;
    --done:#5c5c5c; --danger:#f87171; --chip:#2a2a2a; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  overflow:hidden; position:fixed; inset:0;           /* 外层锁死：橡皮筋只发生在内层滚动容器 */
  -webkit-text-size-adjust:100%;
}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
/* ============ 顶栏 ============ */
header{
  display:flex;align-items:baseline;gap:10px;padding:14px 16px 10px;
  border-bottom:1px solid var(--line);flex:none;
}
#hdrDate{font-size:19px;font-weight:600}
#hdrCount{color:var(--ink2);font-size:14px}
#hdrNet{margin-left:auto;font-size:12px;color:var(--ink3);display:none}
#hdrNet.off{display:block}
/* ============ 滚动区 ============ */
#scroller{
  flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:12px 12px calc(24px + env(safe-area-inset-bottom));
}
#main{max-width:680px;margin:0 auto}
/* ============ 添加栏 ============ */
#addBar{display:flex;gap:8px;margin-bottom:12px}
#addInput{
  flex:1;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--ink);font-size:16px;outline:none;
}
#addInput:focus{border-color:var(--accent)}
#addDay{
  height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:var(--ink2);font-size:14px;touch-action:manipulation;
}
#addDay.on{color:var(--accent);border-color:var(--accent)}
/* ============ 标签过滤 ============ */
#tagBar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
#tagBar:empty{display:none}
.tagf{padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--ink2);font-size:13px;border:1px solid transparent;touch-action:manipulation}
.tagf.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
/* ============ 区块 ============ */
section{margin-bottom:14px}
.sechdr{
  display:flex;align-items:center;gap:8px;padding:6px 4px;color:var(--ink2);
  font-size:14px;font-weight:600;cursor:pointer;user-select:none;-webkit-user-select:none;
}
.sechdr .cnt{font-weight:400;color:var(--ink3)}
.sechdr .arr{margin-left:auto;color:var(--ink3);font-size:12px;transition:transform .15s}
.collapsed .arr{transform:rotate(-90deg)}
.collapsed .secbody{display:none}
.daylabel{padding:8px 4px 4px;color:var(--ink2);font-size:13px;font-weight:600}
.daylabel.past{color:var(--ink3);font-weight:400}
/* ============ 待办行 ============ */
.row{
  display:flex;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:10px;margin-bottom:6px;box-shadow:var(--shadow);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
.row .chk{
  flex:none;width:44px;min-height:48px;border:none;background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;touch-action:manipulation;
}
.row .chk::before{
  content:'';width:20px;height:20px;border:1.5px solid var(--ink3);border-radius:50%;
  display:block;transition:background .15s,border-color .15s;
}
.row.done .chk::before{background:var(--done);border-color:var(--done)}
.row .chk:active::before{border-color:var(--accent)}
.row .body{flex:1;padding:12px 4px 12px 0;min-width:0;cursor:pointer}
.row .t1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .title{word-break:break-word}
.row.done .title{text-decoration:line-through;color:var(--done)}
.row.striking .title{text-decoration:line-through;color:var(--done);transition:color .3s}
.row .t2{margin-top:3px;font-size:12.5px;color:var(--ink3);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--amber-bg);color:var(--amber);white-space:nowrap}
.badge.deep{background:var(--amber-deep-bg);color:var(--amber-deep)}
.tagchip{font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--ink2);white-space:nowrap}
.parkbtn{font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink2);touch-action:manipulation}
.row .drag{
  flex:none;width:40px;min-height:48px;display:flex;align-items:center;justify-content:center;
  color:var(--ink3);cursor:grab;font-size:15px;letter-spacing:-1px;touch-action:none;
}
.row.done .drag,.row.ro .drag{display:none}
.sortable-ghost{opacity:.4}
.sortable-drag{box-shadow:0 6px 20px rgba(0,0,0,.18)}
.empty{color:var(--ink3);font-size:14px;padding:10px 4px}
/* 历史（只读） */
.hday{margin-bottom:10px}
.hhead{font-size:13px;color:var(--ink2);padding:4px}
.hitem{font-size:14px;color:var(--done);padding:2px 4px;text-decoration:line-through;word-break:break-word}
.hitem.dropped{text-decoration:none;color:var(--ink3)}
.hitem.dropped::after{content:'（放弃）';font-size:12px}
/* 提醒/周期区 */
.schrow{display:flex;align-items:center;gap:8px;padding:9px 10px;background:var(--card);border:1px solid var(--line);border-radius:9px;margin-bottom:6px}
.schrow .st{flex:1;min-width:0;font-size:14px;word-break:break-word}
.schrow .sw{font-size:12px;color:var(--ink3);white-space:nowrap}
.schrow.soon .sw{color:var(--amber);font-weight:600}
.schx{flex:none;border:none;background:none;color:var(--ink3);font-size:16px;width:30px;height:30px;cursor:pointer;touch-action:manipulation}
.schkind{font-size:11px;padding:1px 6px;border-radius:999px;background:var(--chip);color:var(--ink2)}
/* ============ 底部抽屉 ============ */
#mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:8}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:9;display:none;
  background:var(--card);border-radius:16px 16px 0 0;box-shadow:0 -4px 30px rgba(0,0,0,.2);
  max-height:82dvh;overflow-y:auto;overscroll-behavior:contain;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));
}
body.sheet-open #mask{display:block}
body.sheet-open #sheet{display:block}
#sheet h3{font-size:13px;color:var(--ink3);font-weight:600;margin:14px 0 6px}
#sheet .xrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#shTitle{width:100%;font-size:17px;font-weight:600;border:none;background:none;color:var(--ink);outline:none;padding:2px 0;border-bottom:1px dashed transparent}
#shTitle:focus{border-bottom-color:var(--accent)}
#shDetail{width:100%;min-height:72px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px 10px;font:14px/1.5 inherit;outline:none;resize:vertical}
#shDetail:focus{border-color:var(--accent)}
.btn{
  min-height:38px;padding:6px 14px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:14px;cursor:pointer;touch-action:manipulation;
}
.btn:active{background:var(--chip)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.warn{color:var(--danger)}
.btn.sm{min-height:32px;padding:3px 10px;font-size:13px}
input[type=date],input[type=datetime-local],input[type=time],#shTag,#shLink{
  min-height:38px;padding:4px 10px;border:1px solid var(--line);border-radius:9px;
  background:var(--card);color:var(--ink);font-size:14px;outline:none;
}
.linkchip{
  display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:4px 10px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);font-size:13px;text-decoration:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
#shClose{position:absolute;top:10px;right:12px;width:36px;height:36px;border:none;background:none;color:var(--ink3);font-size:18px;cursor:pointer}
#shMeta{font-size:12px;color:var(--ink3);margin-top:14px}
/* ============ toast ============ */
#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(30px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;
  display:none;z-index:20;max-width:86vw;box-shadow:0 4px 16px rgba(0,0,0,.25);
}
#toast button{background:none;border:none;color:inherit;font-size:14px;text-decoration:underline;margin-left:10px;cursor:pointer}
/* ============ 桌面双栏 ============ */
@media (min-width:1024px){
  #main{max-width:1080px;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:0 28px;align-items:start}
  #addBar,#tagBar{grid-column:1 / -1}
  #secToday{grid-column:1}
  #railRight{grid-column:2;grid-row:3}
  #sheet{left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-50%);width:520px;border-radius:16px;max-height:80vh}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="hdrDate">待办</div>
    <div id="hdrCount"></div>
    <div id="hdrNet">连接中断，重试中</div>
  </header>
  <div id="scroller"><div id="main">
    <div id="addBar">
      <input id="addInput" type="text" placeholder="添加待办，回车保存" autocomplete="off" enterkeyhint="done">
      <button id="addDay" type="button">今天</button>
    </div>
    <div id="tagBar"></div>
    <section id="secToday"><div class="secbody" id="todayBody"></div></section>
    <div id="railRight">
      <section id="secFuture"><div class="sechdr" data-sec="future">未来 <span class="cnt" id="cntFuture"></span><span class="arr">▾</span></div><div class="secbody" id="futureBody"></div></section>
      <section id="secParked"><div class="sechdr" data-sec="parked">搁置 <span class="cnt" id="cntParked"></span><span class="arr">▾</span></div><div class="secbody" id="parkedBody"></div></section>
      <section id="secSchedule"><div class="sechdr" data-sec="schedule">提醒 / 周期 <span class="cnt" id="cntSchedule"></span><span class="arr">▾</span></div><div class="secbody" id="scheduleBody"></div></section>
      <section id="secHistory"><div class="sechdr" data-sec="history">历史 <span class="cnt" id="cntHistory"></span><span class="arr">▾</span></div><div class="secbody" id="historyBody"></div></section>
    </div>
  </div></div>
</div>
<div id="mask"></div>
<div id="sheet"></div>
<div id="toast"></div>
<script>

<script>
'use strict';
// =====================================================================
// 待办面板前端。设计要点（来自 2026-07-23 三路调研的合成结论）：
//   数据一律来自服务端 getState（与小王工具共用同一查询），本文件只做渲染与转发操作；
//   轮询 4s + 编辑/拖拽中挂起重绘；无 swipe（微信 WebView 边缘手势冲突）；
//   完成=划线沉底+撤销 toast，不用确认弹窗；挂账徽标"第N天"（≥3 琥珀、≥7 深琥珀+就地搁置钮）。
// =====================================================================
const BASE = location.pathname.replace(/\/+$/, '');
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent);

let state = null;
let stamp = '';           // 变更检测：整份 state 的 JSON（数据量小，直接比串）
let sheetId = null;       // 抽屉打开中的待办 id（打开时挂起轮询重绘）
let dragging = false;
let addDayMode = 'today'; // 添加栏的目标日切换：today/tomorrow
let filterTag = null;
let sortable = null;
const collapsed = { future: false, parked: true, schedule: true, history: true };
try { Object.assign(collapsed, JSON.parse(localStorage.getItem('xw2todo.collapse') || '{}')); } catch {}

// ---- 日期显示 ----
const WD = ['周日','周一','周二','周三','周四','周五','周六'];
function dayLabel(day) {
  if (!state) return day;
  const t = new Date(day + 'T00:00:00+08:00');
  const base = `${t.getMonth() + 1}月${t.getDate()}日 ${WD[t.getDay()]}`;
  const diff = Math.round((t - new Date(state.today + 'T00:00:00+08:00')) / 86400e3);
  if (diff === 0) return `今天 · ${base}`;
  if (diff === 1) return `明天 · ${base}`;
  if (diff === 2) return `后天 · ${base}`;
  return base;
}
function addDaysStr(day, n) {
  const t = new Date(day + 'T00:00:00+08:00'); t.setDate(t.getDate() + n);
  return t.toISOString().slice(0, 10);
}

// ---- 网络 ----
async function fetchState() {
  const r = await fetch(`${BASE}/api/state`, { cache: 'no-store' });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'state 拉取失败');
  return j.state;
}
async function op(payload) {
  const r = await fetch(`${BASE}/api/op`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
  });
  const j = await r.json().catch(() => ({ ok: false, error: `HTTP ${r.status}` }));
  if (!j.ok) throw new Error(j.error || '操作失败');
  setState(j.state);
  return j.result;
}
function setState(s) {
  state = s; stamp = JSON.stringify(s);
  render();
  if (sheetId != null) renderSheet(); // 抽屉开着时同步刷新其内容（数据可能被这次操作改了）
}
async function refresh(force) {
  try {
    const s = await fetchState();
    $('hdrNet').classList.remove('off');
    const j = JSON.stringify(s);
    if (j !== stamp && (force || (sheetId == null && !dragging))) { state = s; stamp = j; render(); }
  } catch (e) { $('hdrNet').classList.add('off'); }
}

// ---- 渲染 ----
function findTodo(id) {
  if (!state) return null;
  for (const g of state.days) for (const t of g.todos) if (t.id === id) return t;
  for (const t of state.parked) if (t.id === id) return t;
  for (const g of state.history) for (const t of g.todos) if (t.id === id) return t;
  return null;
}
function rowHtml(t, { readonly = false } = {}) {
  const days = t.rollover_count + 1;
  const badge = t.rollover_count >= 2
    ? `<span class="badge${days >= 7 ? ' deep' : ''}">第${days}天</span>` : '';
  const parkBtn = days >= 7 && !readonly && t.status === 'open'
    ? `<button class="parkbtn" data-act="park">搁置</button>` : '';
  const meta = [];
  if (t.reminder) meta.push(`提醒 ${esc(t.reminder.fire_at_cst.slice(5))}`);
  if (t.links && t.links.length) meta.push(`${t.links.length} 个链接`);
  if (t.detail) meta.push(esc(t.detail.split('\n')[0].slice(0, 40)));
  return `<div class="row${t.status === 'done' ? ' done' : ''}${readonly ? ' ro' : ''}" data-id="${t.id}">
    <button class="chk" aria-label="完成"></button>
    <div class="body">
      <div class="t1"><span class="title">${esc(t.title)}</span>${badge}${t.tag ? `<span class="tagchip">${esc(t.tag)}</span>` : ''}${parkBtn}</div>
      ${meta.length ? `<div class="t2">${meta.join(' · ')}</div>` : ''}
    </div>
    <div class="drag">⠿</div>
  </div>`;
}
const tagPass = (t) => !filterTag || t.tag === filterTag;

function render() {
  if (!state) return;
  // 顶栏
  const todayGroup = state.days.find((g) => g.day === state.today) || { todos: [] };
  const openToday = todayGroup.todos.filter(tagPass);
  $('hdrDate').textContent = dayLabel(state.today).replace('今天 · ', '');
  $('hdrCount').textContent = `剩 ${openToday.length} 件 · 已完成 ${state.stats.today_done}`;
  // 标签过滤
  $('tagBar').innerHTML = (state.tags.length ? state.tags : []).map((tg) =>
    `<button class="tagf${filterTag === tg ? ' on' : ''}" data-tag="${esc(tg)}">${esc(tg)}</button>`).join('');
  // 今天：未完成 + （当天完成的沉底，可撤销）
  const doneToday = (state.history.find((g) => g.day === state.today)?.todos || [])
    .filter((t) => t.status === 'done').filter(tagPass);
  $('todayBody').innerHTML =
    `<div id="todayList">${openToday.map((t) => rowHtml(t)).join('')}</div>`
    + (openToday.length === 0 ? `<div class="empty">今天暂无待办</div>` : '')
    + doneToday.map((t) => rowHtml(t)).join('');
  // 未来
  const future = state.days.filter((g) => g.day !== state.today)
    .map((g) => ({ ...g, todos: g.todos.filter(tagPass) })).filter((g) => g.todos.length);
  $('cntFuture').textContent = future.reduce((n, g) => n + g.todos.length, 0) || '';
  $('futureBody').innerHTML = future.length
    ? future.map((g) => `<div class="daylabel">${dayLabel(g.day)}</div>` + g.todos.map((t) => rowHtml(t)).join('')).join('')
    : `<div class="empty">没有排到未来的待办</div>`;
  // 搁置
  const parked = state.parked.filter(tagPass);
  $('cntParked').textContent = parked.length || '';
  $('parkedBody').innerHTML = parked.length
    ? parked.map((t) => rowHtml(t)).join('')
    : `<div class="empty">搁置区是空的</div>`;
  // 提醒/周期（子淇原则：系统里没有面板看不到的"要发生的事"）——独立一次性提醒 + 周期任务，可取消
  const sch = state.schedules || { reminders: [], recurring: [] };
  const schCount = (sch.reminders?.length || 0) + (sch.recurring?.length || 0);
  $('cntSchedule').textContent = schCount || '';
  const soon = (fireAt) => fireAt - Date.now() < 3 * 3600e3; // 3 小时内 = 低容错，标出来
  $('scheduleBody').innerHTML = schCount ? (
    (sch.reminders || []).map((r) => `<div class="schrow${soon(r.fire_at) ? ' soon' : ''}">
      <span class="schkind">提醒</span>
      <span class="st">${esc(r.note || '(定时提醒)')}</span>
      <span class="sw">${esc(r.fire_at_cst.slice(5))}</span>
      <button class="schx" data-sch="reminder" data-schid="${r.id}" aria-label="取消">✕</button>
    </div>`).join('')
    + (sch.recurring || []).map((j) => `<div class="schrow">
      <span class="schkind">周期</span>
      <span class="st">${esc(j.name)}</span>
      <span class="sw">${esc(j.schedule)}${j.until ? ' 至' + esc(j.until.slice(5)) : ''}</span>
      <button class="schx" data-sch="recurring" data-schid="${j.id}" aria-label="取消">✕</button>
    </div>`).join('')
  ) : `<div class="empty">没有定时提醒或周期任务</div>`;

  // 历史（今天以外，只读）
  const hist = state.history.filter((g) => g.day !== state.today);
  $('cntHistory').textContent = hist.length ? `${hist.length} 天` : '';
  $('historyBody').innerHTML = hist.length
    ? hist.map((g) => {
        const done = g.todos.filter((t) => t.status === 'done');
        const dropped = g.todos.filter((t) => t.status === 'dropped');
        return `<div class="hday"><div class="hhead">${dayLabel(g.day)} · 完成 ${done.length} 件${dropped.length ? `，放弃 ${dropped.length} 件` : ''}</div>`
          + done.map((t) => `<div class="hitem">${esc(t.title)}</div>`).join('')
          + dropped.map((t) => `<div class="hitem dropped">${esc(t.title)}</div>`).join('')
          + `</div>`;
      }).join('')
    : `<div class="empty">还没有历史记录</div>`;
  // 折叠态
  for (const k of ['future', 'parked', 'schedule', 'history']) {
    const sec = $('sec' + k[0].toUpperCase() + k.slice(1));
    sec.classList.toggle('collapsed', !!collapsed[k]);
  }
  // 拖拽（仅今天的未完成列表；handle 把手；调研推荐配置，微信 WebView 实测参数）
  if (window.Sortable) {
    if (sortable) { try { sortable.destroy(); } catch {} sortable = null; }
    const list = $('todayList');
    if (list && !filterTag) { // 过滤视图下顺序不完整，禁拖防错位
      sortable = Sortable.create(list, {
        handle: '.drag', animation: 150, delay: 250, delayOnTouchOnly: true,
        touchStartThreshold: 4, forceFallback: true,
        onStart: () => { dragging = true; },
        onEnd: async (ev) => {
          dragging = false;
          if (ev.oldIndex === ev.newIndex) return;
          const id = Number(ev.item.dataset.id);
          const prev = ev.item.previousElementSibling;
          try { await op({ op: 'reorder', id, after: prev ? Number(prev.dataset.id) : null }); }
          catch {}
        },
      });
    }
  }
}

// ---- toast（含撤销） ----
let toastTimer = null;
function toast(msg, undoFn) {
  const el = $('toast');
  el.innerHTML = esc(msg) + (undoFn ? '<button id="undoBtn">撤销</button>' : '');
  el.style.display = 'block';
  if (undoFn) $('undoBtn').onclick = async () => { el.style.display = 'none'; try { await undoFn(); } catch {} };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = 'none'; }, 5000);
}

// ---- 行级交互（事件委托） ----
$('scroller').addEventListener('click', async (e) => {
  const tagf = e.target.closest('.tagf');
  if (tagf) { filterTag = filterTag === tagf.dataset.tag ? null : tagf.dataset.tag; render(); return; }
  const hdr = e.target.closest('.sechdr');
  if (hdr) {
    const k = hdr.dataset.sec;
    collapsed[k] = !collapsed[k];
    try { localStorage.setItem('xw2todo.collapse', JSON.stringify(collapsed)); } catch {}
    render(); return;
  }
  const schx = e.target.closest('.schx');
  if (schx) {
    const kind = schx.dataset.sch, id = Number(schx.dataset.schid);
    try { await op({ op: 'schedule_cancel', kind, id }); toast(kind === 'recurring' ? '已停掉这个周期任务' : '已取消这条提醒'); }
    catch (err) { toast(err.message); }
    return;
  }
  const row = e.target.closest('.row');
  if (!row) return;
  const id = Number(row.dataset.id);
  const t = findTodo(id);
  if (!t) return;
  if (e.target.closest('.parkbtn')) {
    try { await op({ op: 'park', id }); toast(`已搁置「${t.title}」`, () => op({ op: 'unpark', id })); } catch (err) { toast(err.message); }
    return;
  }
  if (e.target.closest('.chk')) {
    if (t.status === 'open' || t.status === 'parked') {
      row.classList.add('striking'); // 立即划线反馈，600ms 后由重渲染沉底
      setTimeout(async () => {
        try { await op({ op: 'done', id }); toast(`已完成「${t.title}」`, () => op({ op: 'reopen', id })); }
        catch (err) { toast(err.message); refresh(true); }
      }, 350);
    } else if (t.status === 'done') {
      try { await op({ op: 'reopen', id }); } catch (err) { toast(err.message); }
    }
    return;
  }
  if (e.target.closest('.body') && !row.classList.contains('ro')) openSheet(id);
});
// 触摸设备上拦长按系统菜单（不影响桌面右键）
if (matchMedia('(pointer: coarse)').matches) {
  $('scroller').addEventListener('contextmenu', (e) => { if (e.target.closest('.row')) e.preventDefault(); });
}

// ---- 添加 ----
$('addDay').addEventListener('click', () => {
  addDayMode = addDayMode === 'today' ? 'tomorrow' : 'today';
  $('addDay').textContent = addDayMode === 'today' ? '今天' : '明天';
  $('addDay').classList.toggle('on', addDayMode !== 'today');
});
$('addInput').addEventListener('keydown', async (e) => {
  if (e.key !== 'Enter') return;
  let title = $('addInput').value.trim();
  if (!title) return;
  let day = addDayMode;
  // 前缀日期词（轻量版 quick-add：只认开头的 明天/后天）
  if (/^明天[\s，,]/.test(title)) { day = 'tomorrow'; title = title.replace(/^明天[\s，,]+/, ''); }
  else if (/^后天[\s，,]/.test(title)) { day = addDaysStr(state.today, 2); title = title.replace(/^后天[\s，,]+/, ''); }
  if (!title) return;
  $('addInput').value = '';
  try {
    await op({ op: 'add', title, day });
    if (day !== 'today') toast(`已加到${day === 'tomorrow' ? '明天' : dayLabel(day)}`);
  } catch (err) { toast(err.message); $('addInput').value = title; }
});

// ---- 抽屉 ----
function openSheet(id) { sheetId = id; document.body.classList.add('sheet-open'); renderSheet(); }
function closeSheet() { sheetId = null; document.body.classList.remove('sheet-open'); refresh(true); }
$('mask').addEventListener('click', closeSheet);

function renderSheet() {
  const t = findTodo(sheetId);
  if (!t) { closeSheet(); return; }
  const open = t.status === 'open';
  const st = { open: '进行中', parked: '已搁置', done: '已完成', dropped: '已放弃' }[t.status];
  $('sheet').innerHTML = `
    <button id="shClose" aria-label="关闭">✕</button>
    <input id="shTitle" value="${esc(t.title)}" ${t.status === 'done' || t.status === 'dropped' ? 'disabled' : ''}>
    <h3>备注</h3>
    <textarea id="shDetail" placeholder="备注、链接、进展都可以写在这里">${esc(t.detail)}</textarea>
    <div class="xrow" style="margin-top:6px"><button class="btn sm" id="shSaveDetail">保存备注</button></div>
    <h3>链接</h3>
    <div class="xrow" id="shLinks">${(t.links || []).map((u) => `<a class="linkchip" href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//, '').slice(0, 40))}</a>`).join('') || '<span class="empty" style="padding:0">无</span>'}</div>
    <div class="xrow" style="margin-top:6px"><input id="shLink" type="url" placeholder="https://…" style="flex:1;min-width:0"><button class="btn sm" id="shAddLink">添加</button></div>
    <h3>标签</h3>
    <div class="xrow"><input id="shTag" value="${esc(t.tag || '')}" placeholder="项目/分类" list="tagOpts" style="flex:1;min-width:0"><button class="btn sm" id="shSaveTag">保存</button></div>
    <datalist id="tagOpts">${state.tags.map((x) => `<option value="${esc(x)}">`).join('')}</datalist>
    ${open ? `<h3>改期</h3>
    <div class="xrow">
      <button class="btn sm" data-defer="tomorrow">明天</button>
      <button class="btn sm" data-defer="${addDaysStr(state.today, 2)}">后天</button>
      <input id="shDate" type="date" min="${state.today}" value="${t.scheduled_day}">
      <button class="btn sm" id="shDeferPick">改到此日</button>
    </div>` : ''}
    ${open ? `<h3>提醒</h3>
    <div class="xrow">${t.reminder
      ? `<span style="font-size:14px">已设 ${esc(t.reminder.fire_at_cst)} </span><button class="btn sm" id="shRemindOff">取消提醒</button>`
      : `<input id="shRemind" type="datetime-local" min="${state.today}T00:00"><button class="btn sm" id="shRemindOn">设提醒</button>`}
    </div>` : ''}
    <h3>操作</h3>
    <div class="xrow">
      ${open ? `<button class="btn pri" data-op="done">完成</button><button class="btn" data-op="park">搁置</button>` : ''}
      ${t.status === 'parked' ? `<button class="btn pri" data-op="unpark">取回到今天</button><button class="btn pri" data-op="done">完成</button>` : ''}
      ${t.status === 'done' || t.status === 'dropped' ? `<button class="btn" data-op="reopen">重新打开</button>` : ''}
      ${open || t.status === 'parked' ? `<button class="btn warn" data-op="drop">放弃</button>` : ''}
      ${open ? `<button class="btn sm" data-move="up">上移</button><button class="btn sm" data-move="down">下移</button>` : ''}
    </div>
    <div id="shMeta">#${t.id} · ${st} · 创建于 ${t.origin_day}${t.rollover_count ? ` · 已滚动 ${t.rollover_count} 天` : ''}${t.source === 'wechat' ? ' · 来自微信' : ''}</div>`;
  $('shClose').onclick = closeSheet;
  $('shTitle').onchange = () => opSheet({ op: 'edit', id: t.id, title: $('shTitle').value });
  $('shSaveDetail').onclick = () => opSheet({ op: 'edit', id: t.id, detail: $('shDetail').value });
  $('shSaveTag').onclick = () => opSheet({ op: 'edit', id: t.id, tag: $('shTag').value || null });
  $('shAddLink').onclick = () => { const u = $('shLink').value.trim(); if (u) opSheet({ op: 'link', id: t.id, url: u }); };
  if ($('shRemindOn')) $('shRemindOn').onclick = () => {
    const v = $('shRemind').value; if (!v) return;
    opSheet({ op: 'remind', id: t.id, at: v.replace('T', ' ') });
  };
  if ($('shRemindOff')) $('shRemindOff').onclick = () => opSheet({ op: 'remind_cancel', id: t.id });
  if ($('shDeferPick')) $('shDeferPick').onclick = () => { const v = $('shDate').value; if (v) opSheet({ op: 'defer', id: t.id, day: v }); };
  $('sheet').querySelectorAll('[data-defer]').forEach((b) => { b.onclick = () => opSheet({ op: 'defer', id: t.id, day: b.dataset.defer }); });
  $('sheet').querySelectorAll('[data-op]').forEach((b) => {
    b.onclick = async () => {
      const o = b.dataset.op;
      try {
        await op({ op: o, id: t.id });
        if (o === 'done') { closeSheet(); toast(`已完成「${t.title}」`, () => op({ op: 'reopen', id: t.id })); }
        else if (o === 'drop') { closeSheet(); toast(`已放弃「${t.title}」`, () => op({ op: 'reopen', id: t.id })); }
        else if (o === 'park') { closeSheet(); toast(`已搁置「${t.title}」`, () => op({ op: 'unpark', id: t.id })); }
      } catch (err) { toast(err.message); }
    };
  });
  $('sheet').querySelectorAll('[data-move]').forEach((b) => {
    b.onclick = async () => {
      // 上移/下移兜底（拖拽在部分 WebView 上不可靠，调研结论：必须保留按钮路径）
      const g = state.days.find((x) => x.day === t.scheduled_day);
      if (!g) return;
      const ids = g.todos.map((x) => x.id);
      const i = ids.indexOf(t.id);
      const dir = b.dataset.move === 'up' ? -1 : 1;
      const ni = i + dir;
      if (ni < 0 || ni >= ids.length) return;
      const after = dir === -1 ? (ni - 1 >= 0 ? ids[ni - 1] : null) : ids[ni];
      try { await op({ op: 'reorder', id: t.id, after }); } catch (err) { toast(err.message); }
    };
  });
}
async function opSheet(payload) { try { await op(payload); } catch (err) { toast(err.message); } }

// ---- iOS 键盘收起后 WebView 不回弹（微信经典坑）----
if (isIOS) document.addEventListener('focusout', () => setTimeout(() => window.scrollTo(0, 0), 60));

// ---- 轮询：4s；页面隐藏/编辑/拖拽中跳过；回前台立即刷 ----
setInterval(() => { if (!document.hidden) refresh(false); }, 4000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(true); });

// ---- 启动 ----
refresh(true);
</script>
</body>
</html>
